<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldTrack – Field Sales Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f5f9;color:#172033}
header{background:#111827;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-weight:800;font-size:18px}.switch{display:flex;background:#293449;border-radius:9px;padding:4px;gap:4px}.switch button{border:0;background:transparent;color:#cbd5e1;padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:700}.switch button.active{background:white;color:#111827}
main{padding:18px}.phone{max-width:420px;margin:auto;background:#fff;border-radius:25px;border:1px solid #e5e7eb;overflow:hidden;box-shadow:0 15px 40px #0001;min-height:670px}.bluehead{background:#2563eb;color:white;padding:23px}.body{padding:16px}.card{background:#fff;border:1px solid #e7edf3;border-radius:14px;padding:15px;margin-bottom:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f8fafc;border-radius:10px;padding:12px}.stat small{color:#64748b}.stat b{font-size:22px;display:block;margin-top:5px}.btn{border:0;background:#2563eb;color:white;border-radius:10px;padding:12px;width:100%;font-weight:700;cursor:pointer;margin-top:8px}.secondary{background:#eff6ff;color:#2563eb}.green{background:#16a34a}.gray{background:#111827}.pill{background:#fff;border:1px solid #dbe2ea;padding:8px 11px;border-radius:9px;cursor:pointer}.nav{display:flex;justify-content:space-around;border-top:1px solid #e5e7eb;padding:10px;background:white}.nav button{border:0;background:transparent;color:#64748b;padding:8px;border-radius:8px;cursor:pointer;font-size:11px}.nav button.active{background:#eff6ff;color:#2563eb;font-weight:bold}.muted{color:#64748b;font-size:12px}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:bold}.pending{background:#fef3c7;color:#92400e}.map{height:270px;border-radius:14px;background:#e8eff5;position:relative;overflow:hidden;border:1px solid #d5e0e9;background-image:linear-gradient(30deg,transparent 45%,white 46%,white 48%,transparent 49%),linear-gradient(120deg,transparent 34%,white 35%,white 37%,transparent 38%),linear-gradient(0deg,transparent 65%,#d3e0e9 66%,#d3e0e9 67%,transparent 68%);background-size:190px 140px,200px 170px,100% 100%}.pin{position:absolute;background:#2563eb;color:white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:30px;height:30px;display:grid;place-items:center;box-shadow:0 3px 8px #0003}.pin span{transform:rotate(45deg);font-size:11px}.pin.greenpin{background:#16a34a}.pin.orange{background:#f59e0b}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:11px;border-radius:10px;font-size:12px}.input,select,textarea{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:9px;margin:6px 0;background:white}.photo{height:165px;background:linear-gradient(145deg,#dbeafe,#cbd5e1);border-radius:12px;display:grid;place-items:center;text-align:center;color:#475569}.dashboard{display:grid;grid-template-columns:205px 1fr;background:#f8fafc;min-height:700px;border-radius:14px;overflow:hidden}.side{background:#111827;color:#cbd5e1;padding:14px}.side button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:8px;cursor:pointer;margin:3px 0}.side button.active{background:#2563eb;color:white}.dash{padding:20px;min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:white;border:1px solid #e6eaf0;border-radius:13px;padding:14px}.kpi b{font-size:24px;display:block;margin:8px 0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf1f5;white-space:nowrap}.table th{color:#64748b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bars{height:110px;display:flex;align-items:end;gap:8px;padding:8px}.bars i{background:#60a5fa;flex:1;border-radius:4px 4px 0 0}.avatar{background:#dbeafe;color:#1d4ed8;border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center;font-weight:bold}.hide{display:none}@media(max-width:760px){main{padding:8px}.dashboard{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:1fr 1fr}.dash{padding:12px}.table{min-width:650px}}
</style></head>
<body>
<header><div class="brand">📍 FieldTrack <span style="font-size:11px;color:#94a3b8">INTERACTIVE PROTOTYPE</span></div><div class="switch"><button id="salesMode" class="active" onclick="mode('sales')">📱 Sales App</button><button id="adminMode" onclick="mode('admin')">🖥 Admin Dashboard</button></div></header>
<main id="root"></main>
<script>
let view='sales',s='home',a='overview',started=false,visits=3,selected=1,visited={};
const shops=[['Sharma Electronics','Sector 4, Greater Noida West','120 m'],['Gupta TV & Appliances','Gaur City Market','850 m'],['Modern Digital Store','Crossings Republik','1.2 km'],['Raj Electronics','Sector 16, Noida','2.4 km'],['City TV House','Bisrakh Market','3.1 km'],['Om Electronics','Techzone 4','4.2 km']];
function mode(x){view=x;s='home';a='overview';render()}
function nav(x){s=x;render()}function admin(x){a=x;render()}function start(){started=true;s='outlets';render()}function outlet(i){selected=i;s='detail';render()}function submit(){visits++;visited[selected]=true;s='done';render()}
function map(){return `<div class="map"><div class="pin" style="left:20%;top:22%"><span>1</span></div><div class="pin greenpin" style="left:43%;top:45%"><span>2</span></div><div class="pin greenpin" style="left:65%;top:25%"><span>3</span></div><div class="pin orange" style="left:72%;top:65%"><span>4</span></div><div class="pin" style="left:35%;top:75%"><span>5</span></div><div style="position:absolute;bottom:10px;left:10px;background:white;padding:7px;border-radius:7px;font-size:10px">🟢 Visited · 🔵 Employee · 🟠 Pending</div></div>`}
function bottom(){return `<div class="nav"><button onclick="nav('home')">🏠<br>Home</button><button onclick="nav('outlets')">🏪<br>Outlets</button><button onclick="nav('map')">🗺️<br>Map</button><button onclick="nav('profile')">👤<br>Profile</button></div>`}
function sales(){
let h='';
if(s==='home')h=`<div class="bluehead"><div class="muted" style="color:#dbeafe">Good morning 👋</div><h2>Rahul Sharma</h2><div>Territory: Greater Noida West</div></div><div class="body"><div class="card"><div class="row"><b>Today's Progress</b><span class="badge ${started?'':'pending'}">${started?'DAY ACTIVE':'NOT STARTED'}</span></div><div class="stats" style="margin-top:12px"><div class="stat"><small>Assigned</small><b>12</b></div><div class="stat"><small>Visited</small><b>${visits}</b></div><div class="stat"><small>Pending</small><b>${12-visits}</b></div><div class="stat"><small>Distance</small><b>8.4 km</b></div></div><div style="height:7px;background:#e5e7eb;border-radius:9px;margin-top:14px"><div style="height:7px;width:${visits/12*100}%;background:#2563eb;border-radius:9px"></div></div><small class="muted">${visits} of 12 outlets completed</small></div><div class="card"><b>📍 Location Status</b><p>GPS Accuracy <b style="float:right;color:#16a34a">±8 metres</b></p><p>Connectivity <b style="float:right;color:#16a34a">Online</b></p></div><div class="card"><b>Today's Plan</b><p class="muted">Market coverage · Greater Noida West</p>🕘 9:30 AM – 6:00 PM</div>${started?`<button class="btn" onclick="nav('outlets')">Continue Market Visits →</button><button class="btn secondary" onclick="nav('summary')">End My Day</button>`:`<button class="btn" onclick="start()">▶ Start My Day</button>`}</div>`;
if(s==='outlets')h=`<div class="body"><h2>Today's Outlets</h2><p class="muted">Assigned market · ${visits} completed</p><input class="input" placeholder="🔍 Search outlets" oninput="document.querySelectorAll('.shop').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(this.value.toLowerCase())?'':'none')">${shops.map((x,i)=>`<div class="card shop" onclick="outlet(${i})"><div class="row"><div><b>🏪 ${x[0]}</b><div class="muted">${x[1]}</div><small>${x[2]}</small></div><span class="badge ${visited[i]?'':'pending'}">${visited[i]?'Visited':'Pending'}</span></div></div>`).join('')}<div class="notice">GPS tracking is active during your work session.</div></div>`;
if(s==='detail'){let x=shops[selected];h=`<div class="body"><button class="pill" onclick="nav('outlets')">← Back</button><h2>${x[0]}</h2><p class="muted">${x[1]}</p><div class="card"><b>Retail Outlet</b><p>📍 Coordinates: 28.6104, 77.4218</p><p>Distance from you: <b>${x[2]}</b></p><p>Last visit: Nov 18, 2026</p></div>${map()}<button class="btn secondary">🧭 Navigate to Outlet</button><button class="btn" onclick="nav('checkin')">📍 Start Outlet Visit</button></div>`}
if(s==='checkin')h=`<div class="body"><button class="pill" onclick="nav('detail')">← Back</button><h2>Outlet Check-in</h2><div class="card" style="text-align:center"><div style="font-size:45px">📍</div><h3>Location Verified</h3><span class="badge">Within Outlet Geofence</span><div class="stats" style="margin-top:15px"><div class="stat"><small>Distance</small><b>24 m</b></div><div class="stat"><small>Accuracy</small><b>±8 m</b></div></div><p class="muted">Coordinates: 28.6104, 77.4218</p></div><div class="card">Check-in time <b style="float:right">12:42 PM</b><br><br>Location Status <b style="float:right;color:#16a34a">Verified ✓</b></div><button class="btn" onclick="nav('photo')">Continue to Outlet Photo →</button></div>`;
if(s==='photo')h=`<div class="body"><button class="pill" onclick="nav('checkin')">← Back</button><h2>Outlet Photo</h2><p class="muted">Capture the shop front as visit evidence.</p><div class="photo">📷<br>Camera Preview<br><small>Shop front should be clearly visible</small></div><div class="card">GPS attached <b style="float:right">✓</b><br><br>Timestamp <b style="float:right">12:42 PM</b><br><br>Outlet <b style="float:right">Verified</b></div><button class="btn secondary">📷 Capture / Retake Photo</button><button class="btn" onclick="nav('report')">Use Photo & Continue →</button></div>`;
if(s==='report')h=`<div class="body"><button class="pill" onclick="nav('photo')">← Back</button><h2>Visit Report</h2><div class="card"><label class="muted">Visit Outcome</label><select class="input"><option>Successful Visit</option><option>Retailer Not Available</option><option>Shop Closed</option></select><label class="muted">Stock Status</label><select class="input"><option>Stock Available</option><option>Stock Low</option><option>Out of Stock</option></select><label class="muted">Order Taken</label><select class="input"><option>No</option><option>Yes</option></select><label class="muted">Remarks</label><textarea class="input" rows="3" placeholder="Enter visit observations"></textarea><label><input type="checkbox"> Follow-up required</label></div><div class="notice">GPS ✓ · Photo ✓ · Timestamp ✓</div><button class="btn green" onclick="submit()">✓ Submit Visit</button></div>`;
if(s==='done')h=`<div class="bluehead" style="text-align:center;padding:40px"><div style="font-size:55px">✅</div><h2>Visit Submitted!</h2><p>Your visit has been recorded successfully.</p></div><div class="body"><div class="card">Verification <span class="badge" style="float:right">Verified</span><p>GPS <b style="float:right">✓ Captured</b></p><p>Photo <b style="float:right">✓ Uploaded</b></p><p>Timestamp <b style="float:right">12:42 PM</b></p></div><button class="btn" onclick="nav('outlets')">Return to Outlet List</button><button class="btn secondary" onclick="nav('home')">View Dashboard</button></div>`;
if(s==='map')h=`<div class="body"><h2>My Market Route</h2><p class="muted">Today's movement and outlet visits</p>${map()}<div class="card"><b>Route Summary</b><div class="stats"><div class="stat"><small>Distance</small><b>8.4 km</b></div><div class="stat"><small>Stops</small><b>${visits}</b></div></div></div></div>`;
if(s==='summary')h=`<div class="bluehead"><h2>Day Summary</h2><p>Work session completed</p></div><div class="body"><div class="stats"><div class="stat"><small>Visits</small><b>${visits}</b></div><div class="stat"><small>Assigned</small><b>12</b></div><div class="stat"><small>Distance</small><b>18.6 km</b></div><div class="stat"><small>Hours</small><b>7h 42m</b></div></div><div class="card"><b>Work Session</b><p>Start <b style="float:right">9:18 AM</b></p><p>End <b style="float:right">5:00 PM</b></p><p>Status <span class="badge" style="float:right">Completed</span></p></div><button class="btn" onclick="nav('home')">Back to Home</button></div>`;
if(s==='profile')h=`<div class="body"><h2>Profile</h2><div class="card" style="text-align:center"><div style="font-size:45px">👤</div><h3>Rahul Sharma</h3><small class="muted">Sales Representative · EMP-1024</small></div><div class="card"><p>Territory <b style="float:right">Greater Noida West</b></p><p>Phone <b style="float:right">+91 98xxxxxx42</b></p><p>GPS Permission <b style="float:right;color:#16a34a">Enabled</b></p></div><button class="btn secondary">Settings & Permissions</button><button class="btn gray">Logout</button></div>`;
return `<div class="phone">${h}${bottom()}</div>`;
}
const people=[['Rahul Sharma','RS','EMP-1024','Greater Noida West',8,12,'On Route','12:42 PM'],['Amit Verma','AV','EMP-1025','Noida Sector 62',6,10,'On Route','12:35 PM'],['Suresh Kumar','SK','EMP-1026','Ghaziabad',9,14,'Active','12:30 PM'],['Vikas Singh','VS','EMP-1027','Crossings Republik',4,11,'Inactive','11:58 AM']];
function adminUI(){
let content='';
if(a==='overview')content=`<div class="row"><div><h2>Overview</h2><small class="muted">Saturday, November 21, 2026</small></div><button class="pill">📅 Today ▾</button></div><div class="kpis"><div class="kpi"><small>Sales Team</small><b>24</b><small style="color:#16a34a">18 active</small></div><div class="kpi"><small>Outlet Visits</small><b>186</b><small style="color:#16a34a">+12% vs yesterday</small></div><div class="kpi"><small>Verified Visits</small><b>172</b><small style="color:#16a34a">92.5% verified</small></div><div class="kpi"><small>Pending Outlets</small><b>48</b><small style="color:#f59e0b">Need attention</small></div></div><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:15px"><div class="card"><div class="row"><b>Sales Team Live Map</b><button class="pill" onclick="admin('map')">View Map →</button></div>${map()}</div><div class="card"><b>Daily Visit Performance</b><div class="bars">${[45,65,52,80,90,66,95,70,58,85,60,75].map(x=>`<i style="height:${x}%"></i>`).join('')}</div><small class="muted">Visits by hour · 9 AM – 5 PM</small></div></div><div class="card"><b>Today's Sales Team</b>${table(true)}</div><div class="notice">⚠️ 4 visits require review · 2 employees have not updated location for 30+ minutes</div>`;
if(a==='map')content=`<div class="row"><div><h2>Live Field Map</h2><small class="muted">Monitor salesperson movement and outlet visits</small></div><button class="pill">Today ▾</button></div>${map()}<div class="card"><b>Active Employees</b>${table(false)}</div>`;
if(a==='employees')content=`<div class="row"><div><h2>Sales Team</h2><small class="muted">Manage employees and monitor field activity</small></div><button class="btn" style="width:auto">＋ Add Employee</button></div><div class="card">${table(false)}</div>`;
if(a==='outlets')content=`<div class="row"><div><h2>Outlet Management</h2><small class="muted">Retailer master data and territory assignments</small></div><button class="btn" style="width:auto">＋ Add Outlet</button></div><div class="card"><input class="input" placeholder="Search outlet, area or salesperson"><div class="tablewrap"><table class="table"><thead><tr><th>Outlet</th><th>Area</th><th>Assigned Employee</th><th>Last Visit</th><th>Status</th></tr></thead><tbody>${shops.map((x,i)=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${people[i%4][0]}</td><td>${i<3?'Today':'Nov 18'}</td><td><span class="badge ${i>2?'pending':''}">${i<3?'Visited':'Pending'}</span></td></tr>`).join('')}</tbody></table></div></div>`;
if(a==='reports')content=`<h2>Reports & Analytics</h2><div class="kpis"><div class="kpi"><small>Total Visits</small><b>1,248</b></div><div class="kpi"><small>Verification Rate</small><b>94.2%</b></div><div class="kpi"><small>Avg Visits / Person</small><b>52</b></div><div class="kpi"><small>Coverage</small><b>87%</b></div></div><div class="card"><b>Employee Performance</b>${table(false)}</div><button class="btn" style="width:auto">⬇ Download Excel Report</button>`;
if(a==='exceptions')content=`<h2>Visit Exceptions</h2><div class="notice">4 exceptions detected today</div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Employee</th><th>Outlet</th><th>Issue</th><th>Time</th><th>Action</th></tr></thead><tbody><tr><td>Rahul Sharma</td><td>City TV House</td><td>GPS outside geofence</td><td>1:22 PM</td><td><button class="pill">Review</button></td></tr><tr><td>Amit Verma</td><td>Gupta Electronics</td><td>Photo missing</td><td>12:48 PM</td><td><button class="pill">Review</button></td></tr><tr><td>Vikas Singh</td><td>Modern TV</td><td>Low GPS accuracy</td><td>11:30 AM</td><td><button class="pill">Review</button></td></tr><tr><td>Suresh Kumar</td><td>New Digital</td><td>Repeated coordinates</td><td>10:45 AM</td><td><button class="pill">Review</button></td></tr></tbody></table></div></div>`;
return `<div class="dashboard"><aside class="side"><b style="display:block;color:white;padding:10px">FIELDTRACK</b>${[['overview','▦ Overview'],['map','🗺 Live Map'],['employees','👥 Sales Team'],['outlets','🏪 Outlets'],['reports','📊 Reports'],['exceptions','⚠ Exceptions']].map(x=>`<button class="${a===x[0]?'active':''}" onclick="admin('${x[0]}')">${x[1]}</button>`).join('')}<div style="margin-top:30px;padding:10px;font-size:11px;color:#94a3b8">Admin<br><b style="color:white">Business Owner</b></div></aside><div class="dash">${content}</div></div>`;
}
function table(overview){return `<div class="tablewrap"><table class="table"><thead><tr><th>Employee</th><th>${overview?'Status':'Territory'}</th><th>Visits</th><th>Assigned</th><th>Last Update</th><th></th></tr></thead><tbody>${people.map(p=>`<tr><td><span class="avatar">${p[1]}</span> <b>${p[0]}</b><div class="muted">${p[2]}</div></td><td>${overview?`<span class="badge">${p[6]}</span>`:p[3]}</td><td>${p[4]}</td><td>${p[5]}</td><td>${p[7]}</td><td><button class="pill" onclick="admin('employees')">Details</button></td></tr>`).join('')}</tbody></table></div>`}
function render(){document.getElementById('salesMode').className=view==='sales'?'active':'';document.getElementById('adminMode').className=view==='admin'?'active':'';document.getElementById('root').innerHTML=view==='sales'?sales():adminUI()}
render();
</script></body></html>
